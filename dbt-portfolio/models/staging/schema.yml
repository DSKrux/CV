version: 2

sources:
  - name: raw
    schema: "{{ target.schema }}"
    tables:
      - name: raw_customers
      - name: raw_products
      - name: raw_orders
        loaded_at_field: updated_at
        freshness:
          warn_after: {count: 3, period: day}
          error_after: {count: 7, period: day}
      - name: raw_order_items
        loaded_at_field: updated_at
        freshness:
          warn_after: {count: 3, period: day}
          error_after: {count: 7, period: day}

models:
  - name: stg_customers
    columns:
      - name: customer_id
        tests: [not_null, unique]
      - name: email
        tests: [not_null, unique]
      - name: customer_status
        tests:
          - accepted_values:
              arguments:
                values: ['active', 'churned']

  - name: stg_products
    columns:
      - name: product_id
        tests: [not_null, unique]
      - name: unit_price
        tests:
          - non_negative

  - name: stg_orders
    columns:
      - name: order_id
        tests: [not_null, unique]
      - name: customer_id
        tests:
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id
      - name: order_date
        tests: [not_null]

  - name: stg_order_items
    columns:
      - name: order_item_id
        tests: [not_null, unique]
      - name: order_id
        tests:
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id
      - name: product_id
        tests:
          - relationships:
              arguments:
                to: ref('stg_products')
                field: product_id
      - name: quantity
        tests:
          - non_negative
      - name: discount_pct
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 1
