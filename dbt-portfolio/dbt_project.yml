name: analytics_engineering_portfolio
version: 1.0.0
config-version: 2

profile: analytics_engineering_portfolio

# Elementary: populate audit tables after every run
on-run-end:
  - "{{ elementary.on_run_end() }}"

model-paths: ["models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
test-paths: ["tests"]
snapshot-paths: ["snapshots"]
analysis-paths: ["analyses"]

clean-targets:
  - target
  - dbt_packages

models:
  analytics_engineering_portfolio:
    staging:
      +materialized: view
    marts:
      +materialized: table
  # Elementary internal audit models — always table-materialized in own schema
  elementary:
    +schema: elementary
    +materialized: table

seeds:
  analytics_engineering_portfolio:
    +quote_columns: false

snapshots:
  analytics_engineering_portfolio:
    +target_schema: snapshots
