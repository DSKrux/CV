<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CV – D3 Visualization</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- ── Header ─────────────────────────────────── -->
  <header id="header">
    <div class="avatar">👤</div>
    <div class="info">
      <h1 id="person-name">Loading…</h1>
      <div class="title-line" id="person-title"></div>
      <div class="meta">
        <span>📍 <span id="person-location"></span></span>
        <span>✉️ <span id="person-email"></span></span>
        <span>🐙 <span id="person-github"></span></span>
        <span>💼 <span id="person-linkedin"></span></span>
      </div>
      <p class="summary" id="person-summary"></p>
    </div>
  </header>

  <!-- ── Navigation ─────────────────────────────── -->
  <nav id="nav">
    <button data-target="section-skills"     class="active">Skills</button>
    <button data-target="section-experience"         >Experience</button>
    <button data-target="section-education"          >Education</button>
    <button data-target="section-projects"           >Projects</button>
  </nav>

  <!-- ── Tooltip (shared for D3) ────────────────── -->
  <div id="skills-tooltip">
    <div class="tt-name"></div>
    <div class="tt-cat"></div>
    <div class="tt-bar"><div class="tt-fill"></div></div>
  </div>

  <main>

    <!-- Skills ──────────────────────────────────── -->
    <section id="section-skills" class="section visible">
      <h2 class="section-title">Skills</h2>
      <div id="skills-viz">
        <!-- D3 SVG injected here -->
        <div class="legend" id="skills-legend"></div>
      </div>
      <p style="margin-top:12px;font-size:0.8rem;color:var(--text-muted);">
        ✦ Bubble size reflects proficiency level &nbsp;·&nbsp; Drag bubbles to explore &nbsp;·&nbsp; Hover for details
      </p>
    </section>

    <!-- Experience ──────────────────────────────── -->
    <section id="section-experience" class="section">
      <h2 class="section-title">Experience</h2>
      <div class="timeline" id="exp-timeline"></div>
    </section>

    <!-- Education ───────────────────────────────── -->
    <section id="section-education" class="section">
      <h2 class="section-title">Education</h2>
      <div class="timeline" id="edu-timeline"></div>
    </section>

    <!-- Projects ────────────────────────────────── -->
    <section id="section-projects" class="section">
      <h2 class="section-title">Projects</h2>
      <div class="projects-grid" id="projects-grid"></div>
    </section>

  </main>

  <!-- D3 v7 (CDN) -->
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <!-- App logic -->
  <script src="app.js"></script>
</body>
</html>
